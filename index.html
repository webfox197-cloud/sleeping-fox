<style id="sf-style">/* Layout: sticky bar, then an orange "probador" stage (3D garment + a black hang-tag order panel),
   dark racks for the catalogue, a heather-grey band for shipping and care, dark footer. Single committed look. */
:root{
  --ink:#15110E; --ink-2:#211B17; --ink-3:#2F2721; --line:#43382F;
  --fox:#F2681C; --fox-hi:#FFA24A; --fox-deep:#B4440A;
  --tela:#E6E2DD; --tela-2:#D3CEC8; --tela-ink:#27221E;
  --white:#FFFCF8; --muted:#B3A79B; --wa:#1DA851; --bad:#FF7A6B;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html.lock{overflow:hidden}
body{background:var(--ink);color:var(--white);font:16px/1.55 var(--body);overflow-x:hidden}
h1,h2,h3,p,fieldset,figure{margin:0}
fieldset{border:0;padding:0;min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--fox-hi);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.ico{width:1.25em;height:1.25em;flex:none}
.eyebrow{font:500 .75rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.h2{font:900 clamp(2.4rem,7vw,4.5rem)/.9 var(--display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px clamp(16px,4vw,40px);background:var(--ink);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;min-width:0;background:none;border:0;padding:0}
.brand img{width:40px;height:40px;border-radius:50%;flex:none}
.brand span{font:900 1.55rem/1 var(--display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill{display:flex;align-items:center;gap:8px;font:500 .75rem/1 var(--mono);color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on{color:var(--white)}.pill.on i{background:var(--wa);box-shadow:0 0 0 4px rgba(29,168,81,.22)}
.ibtn{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--ink-2)}
.ibtn:hover{border-color:var(--fox)}
.ibtn b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--fox);color:var(--ink);font:500 .72rem/20px var(--mono);text-align:center}
.ibtn b[data-n="0"]{display:none}
@media(max-width:640px){.pill span{display:none}.brand span{font-size:1.3rem}}

/* ticker */
.ticker{overflow:hidden;background:var(--ink-2);border-bottom:1px solid var(--line)}
.ticker div{display:flex;width:max-content;animation:tick 38s linear infinite}
.ticker span{padding:9px 0;font:500 .74rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fox-hi);white-space:nowrap}
.ticker span::after{content:"✦";margin:0 22px;color:var(--line)}
@keyframes tick{to{transform:translateX(-50%)}}

/* stage */
.stage{position:relative;overflow:hidden;background:var(--fox);color:var(--ink);padding-block:clamp(18px,3vw,36px) clamp(24px,4vw,44px);
  background-image:radial-gradient(rgba(21,17,14,.16) 1.3px,transparent 1.6px);background-size:11px 11px}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 32% 46%,var(--fox-hi),transparent 70%),linear-gradient(180deg,transparent 60%,var(--fox-deep) 160%);opacity:.9;pointer-events:none}
.stage-word{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding-left:2vw;pointer-events:none;
  font:900 clamp(7rem,25vw,23rem)/.78 var(--display);text-transform:uppercase;color:transparent;-webkit-text-stroke:2px rgba(21,17,14,.17);white-space:nowrap}
.stage-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(16px,3vw,40px);align-items:center}
.lead{position:relative;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:8px}
.lead strong{font:900 clamp(1.5rem,3.4vw,2.3rem)/1 var(--display);text-transform:uppercase}
.lead span{font-weight:600}
.cbox{position:relative;aspect-ratio:1/1;max-height:640px;width:100%;margin-inline:auto}
.cbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab;display:block}
.cbox canvas:active{cursor:grabbing}
.cbox .mock{position:absolute;inset:6% 12%}
.hint{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);padding:6px 12px;border-radius:99px;background:rgba(21,17,14,.82);color:var(--white);font:500 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.hint.off{opacity:0}
.vbar{position:relative;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 15px;border-radius:99px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap}
.chip:hover{background:rgba(21,17,14,.1)}
.chip[aria-pressed="true"],.chip.solid{background:var(--ink);color:var(--white)}
.chip.solid:hover{background:var(--ink-3)}

/* hang tag panel */
.tag{position:relative;background:var(--ink);color:var(--white);border-radius:18px;padding:46px clamp(18px,2.4vw,28px) clamp(18px,2.4vw,26px);
  display:flex;flex-direction:column;gap:16px;box-shadow:0 26px 50px -22px rgba(60,20,0,.65);transform:rotate(.6deg)}
.tag::before{content:"";position:absolute;top:14px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--fox);box-shadow:0 0 0 3px var(--ink-3)}
.tag::after{content:"";position:absolute;bottom:calc(100% - 23px);left:50%;width:2px;height:70px;background:var(--white);opacity:.85;transform-origin:bottom;transform:rotate(-24deg);border-radius:2px}
.tag .eyebrow{color:var(--fox-hi)}
.tag h1{font:900 clamp(2rem,4.2vw,3.1rem)/.92 var(--display);text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.tag .desc{color:var(--muted);font-size:.95rem}
.price{font:500 1rem/1.2 var(--mono);color:var(--white)}
.price small{color:var(--muted);font-size:.8rem}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>legend,.fld>label,.fld>.lbl{font:500 .7rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:8px;float:none}
.fld>legend b{color:var(--white);font-weight:500;letter-spacing:.04em;text-transform:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--white);box-shadow:0 0 0 3px var(--fox)}
.opt{min-width:44px;min-height:40px;padding:0 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--ink-2);font:500 .9rem/1 var(--mono)}
.opt:hover{border-color:var(--fox)}
.opt[aria-pressed="true"]{background:var(--white);border-color:var(--white);color:var(--ink)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--ink-2)}
.qty button{width:40px;height:40px;border:0;background:none;display:grid;place-items:center}
.qty output{min-width:30px;text-align:center;font:500 1rem var(--mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 20px;border-radius:12px;border:0;font-weight:700;text-decoration:none;text-align:center;cursor:pointer}
.btn.fox{background:var(--fox);color:var(--ink)}.btn.fox:hover{background:var(--fox-hi)}
.btn.wa{background:var(--wa);color:#fff}.btn.wa:hover{filter:brightness(1.08)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--white)}.btn.line:hover{border-color:var(--fox)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rng{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:.9rem}
.rng input{width:100%;accent-color:var(--fox)}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
.chk input{width:18px;height:18px;accent-color:var(--fox)}

/* design strip */
.strip{position:relative;display:flex;gap:10px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:thin;scrollbar-color:var(--ink) transparent}
.strip button{flex:none;width:74px;height:74px;border-radius:14px;border:2px solid var(--ink);background:var(--c,var(--ink));padding:7px;display:grid;place-items:center}
.strip button img{max-width:100%;max-height:100%;object-fit:contain}
.strip button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--white)}
.strip label{flex:none;width:74px;height:74px;border-radius:14px;border:2px dashed var(--ink);display:grid;place-items:center;text-align:center;font:500 .62rem/1.25 var(--mono);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}

@media(max-width:860px){
  .stage-grid{grid-template-columns:minmax(0,1fr)}
  .tag{transform:none}.tag::after{display:none}
  .cbox{max-height:440px}
}
@media(max-width:420px){.cta{grid-template-columns:1fr}}

/* sections */
.sec{padding-block:clamp(44px,7vw,84px)}
section,#cuidados,.foot{scroll-margin-top:calc(66px + env(safe-area-inset-top,0px))}
.sec-head{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.sec-head p{color:var(--muted);max-width:46ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;align-items:center}
.f{min-height:38px;padding:0 15px;border-radius:99px;border:1.5px solid var(--line);background:none;font-weight:600;font-size:.9rem}
.f:hover{border-color:var(--fox)}
.f[aria-pressed="true"]{background:var(--fox);border-color:var(--fox);color:var(--ink)}
.search{flex:1 1 180px;max-width:280px;min-height:38px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--ink-2);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;perspective:1200px}
.card{display:flex;flex-direction:column;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,border-color .2s;transform-style:preserve-3d}
.card:hover{border-color:var(--fox)}
.shot{position:relative;aspect-ratio:7/8;width:100%;border:0;padding:0;background:var(--tela);background-image:radial-gradient(rgba(39,34,30,.09) 1px,transparent 1.3px);background-size:7px 7px;display:block;overflow:hidden}
.shot img.r3{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .35s}
.card:hover .shot img.r3{transform:scale(1.06) rotate(-1.5deg)}
.shot .mock{position:absolute;inset:8% 10%}
.shot em{position:absolute;left:10px;top:10px;padding:5px 9px;border-radius:99px;background:var(--ink);color:var(--white);font:500 .64rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;font-style:normal}
.meta{display:flex;flex-direction:column;gap:4px;padding:13px 14px 4px;min-width:0}
.meta h3{font:700 1.02rem/1.25 var(--body);overflow-wrap:anywhere}
.meta span{font:500 .78rem/1.3 var(--mono);color:var(--muted)}
.acts{display:flex;gap:8px;padding:10px 14px 14px;margin-top:auto}
.acts .btn{flex:1}
.acts .btn.plus{flex:none;width:40px;padding:0}
.empty{grid-column:1/-1;padding:34px 20px;border:1.5px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}
.mock{display:grid;place-items:center}
.mock svg{position:absolute;inset:0;width:100%;height:100%}
.mock img{position:relative;width:38%;max-height:42%;object-fit:contain;margin-top:-14%}

.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;border-top:1px solid var(--line)}
.svc div{padding:22px 22px 24px 0;border-bottom:1px solid var(--line)}
.svc h3{font:900 1.9rem/1 var(--display);text-transform:uppercase;color:var(--fox-hi);margin-bottom:8px}
.svc p{color:var(--muted);max-width:34ch}

/* heather band */
.band{background:var(--tela);color:var(--tela-ink);background-image:repeating-linear-gradient(115deg,rgba(39,34,30,.035) 0 2px,transparent 2px 5px),repeating-linear-gradient(25deg,rgba(255,255,255,.3) 0 1px,transparent 1px 6px)}
.band .sec-head p{color:#5d544c}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,5vw,64px)}
@media(max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tab{min-height:42px;padding:0 16px;border-radius:99px;border:1.5px solid var(--tela-ink);background:none;color:var(--tela-ink);font-weight:700}
.tab[aria-selected="true"]{background:var(--tela-ink);color:var(--tela)}
.pane{min-height:150px;padding:22px;border-radius:16px;background:var(--white);border:1px solid var(--tela-2);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.pane h3{font:900 2rem/1 var(--display);text-transform:uppercase}
.pane ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.band .btn.line{color:var(--tela-ink);border-color:var(--tela-ink)}

/* footer */
.foot{border-top:1px solid var(--line);padding-block:44px 110px}
.foot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:28px}
.foot h3{font:500 .72rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.foot p{overflow-wrap:anywhere}
.foot .big{font:900 2.2rem/1 var(--display);text-transform:uppercase}
.copy{display:inline-flex;gap:6px;align-items:center;margin-left:8px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:none;font:500 .72rem var(--mono)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--wa);color:#fff;font-weight:700;text-decoration:none;box-shadow:0 12px 28px -10px rgba(0,0,0,.7)}
.fab .ico{width:26px;height:26px}
.fab.ig{background:var(--fox);color:var(--ink)}

/* drawers */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,6,5,.66)}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--ink-2);border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));gap:14px;overflow-y:auto;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dhead h2{font:900 2rem/1 var(--display);text-transform:uppercase}
.nav{display:flex;flex-direction:column}
.nav button{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border:0;border-bottom:1px solid var(--line);background:none;font:900 1.9rem/1 var(--display);text-transform:uppercase;text-align:left}
.nav button:hover{color:var(--fox-hi)}
.nav .adm{margin-top:22px;border:0;font:500 .78rem/1 var(--mono);letter-spacing:.14em;color:var(--muted);justify-content:flex-start;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item h3{font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.item p{font:500 .78rem/1.4 var(--mono);color:var(--muted)}
.item .x{align-self:start;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center}
.inp{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--ink);color:var(--white)}
textarea.inp{min-height:76px;resize:vertical}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border-radius:10px;background:var(--ink);border:1px dashed var(--line);font:400 .8rem/1.5 var(--mono);color:var(--muted);user-select:all;margin:0}
.note{font-size:.84rem;color:var(--muted)}
.err{color:var(--bad);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;max-width:min(92vw,460px);padding:12px 18px;border-radius:12px;background:var(--white);color:var(--ink);font-weight:600;box-shadow:0 14px 34px -12px #000;text-align:center}

/* modal + admin */
.modal{position:fixed;z-index:60;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,6,5,.72)}
.sheet{width:min(400px,100%);background:var(--ink-2);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font:900 2.1rem/1 var(--display);text-transform:uppercase}
.adm-root{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.abar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px clamp(16px,3vw,28px);border-bottom:1px solid var(--line);background:var(--ink-2)}
.abar h2{font:900 1.7rem/1 var(--display);text-transform:uppercase;margin-right:auto}
.abar .w{font:500 .74rem var(--mono);color:var(--muted)}
.atabs{display:flex;gap:6px;padding:10px clamp(16px,3vw,28px);border-bottom:1px solid var(--line);overflow-x:auto}
.abody{flex:1;overflow-y:auto;padding:20px clamp(16px,3vw,28px) calc(40px + env(safe-area-inset-bottom,0px))}
.dirty{padding:10px 14px;border-radius:10px;background:rgba(242,104,28,.16);border:1px solid var(--fox);margin-bottom:16px;font-size:.92rem}
.acols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:start}
@media(max-width:900px){.acols{grid-template-columns:minmax(0,1fr)}}
.plist{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--ink-2)}
.pl.cur{border-color:var(--fox)}
.pl .th{width:46px;height:46px;border-radius:10px;background:var(--c);display:grid;place-items:center;padding:5px;flex:none;border:1px solid var(--line)}
.pl .th{overflow:hidden}
.pl .th img{width:100%;height:100%;object-fit:contain}
.pl .t{flex:1 1 120px;min-width:0}
.pl .t b{display:block;overflow-wrap:anywhere;font-size:.95rem}
.pl .t span{font:500 .72rem var(--mono);color:var(--muted)}
.mini{min-width:36px;height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--ink);font-size:.82rem;font-weight:600}
.mini:hover{border-color:var(--fox)}.mini.del{color:var(--bad)}
.editor{display:flex;flex-direction:column;gap:14px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--ink-2)}

const thumbKey=p=>[p.id,p.garment,p.color].concat(layersOf(p).map(l=>[l.zone,l.x,l.y,l.top,l.w,l.rot,l.img.length,l.img.slice(-16)].join(','))).join('|');
function getShooter(){if(!shooterTried){shooterTried=true;const c=document.createElement('canvas');shooter=Shirt3D(c,{snap:true,w:420,h:480,tex:1024,logo:st.logo})}return shooter}
function shoot(p){
  const k=thumbKey(p);if(thumbs.has(k))return Promise.resolve(thumbs.get(k));getShooter();
  if(!shooter)return Promise.resolve(null);
  return shootQ=shootQ.then(()=>shooter.snap(vcfg(p),zoneAngle(mainZone(p))-.42)).then(u=>{thumbs.set(k,u);return u}).catch(()=>null);
}

  const a=from.getBoundingClientRect(),t=cartB.getBoundingClientRect(),d=document.createElement('div');d.className='fly';d.style.left=(a.left+a.width/2-14)+'px';d.style.top=(a.top+a.height/2-14)+'px';document.body.appendChild(d);
  const dx=t.left+t.width/2-(a.left+a.width/2),dy=t.top+t.height/2-(a.top+a.height/2);
  d.animate([{transform:'translate(0,0) scale(1)'},{transform:'translate('+dx*.55+'px,'+(dy*.55-90)+'px) scale(.9)',offset:.55},{transform:'translate('+dx+'px,'+dy+'px) scale(.25)',opacity:.3}],{duration:700,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=()=>{d.remove();const n=$('#cartN');if(n&&n.animate)n.animate([{transform:'scale(1)'},{transform:'scale(1.6)'},{transform:'scale(1)'}],{duration:320})};
}

/* ---------------- shipping abroad: estimate from the rates the shop loads in the panel ---------------- */
const gkey=n=>Object.keys(GNAMES).find(k=>GNAMES[k]===n)||'remera';
const cartKg=()=>ui.cart.reduce((a,i)=>a+(KG[gkey(i.garment)]||.3)*i.qty,0);
const provZone=()=>(PROV.find(p=>p[0]===ui.prov)||PROV[0])[1];
function shipEst(c,z,kg){const r=((st.shipRates||{})[c]||{})[z],b=r?+r[0]:0;if(!b)return 0;return b+Math.max(0,Math.ceil(kg-1-1e-9))*(+r[1]||0)}
const carrierName=()=>(CARR.find(c=>c[0]===ui.carrier)||CARR[0])[1];
const quoteKg=()=>ui.cart.length?cartKg():ui.qn*KG.remera;
const shipNow=()=>ui.dest==='arg'?shipEst(ui.carrier,provZone(),quoteKg()):0;
function quoteText(){const e=shipEst(ui.carrier,provZone(),quoteKg());return e?'<b>'+money(e)+'</b> aprox. con '+carrierName()+' a '+esc(ui.prov):'Todavía no cargamos la tarifa de '+carrierName()+' para '+esc(ui.prov)+'. Escribinos y te la pasamos.'}

/* ---------------- server API (only when the page runs on Netlify) ---------------- */
async function api(path,o){o=o||{};const h={};if(o.json!==undefined){h['Content-Type']='application/json';o.body=JSON.stringify(o.json)}
  if(o.auth==='user'&&ACC.token)h.Authorization='Bearer '+ACC.token;if(o.auth==='admin'&&NET.cred)h.Authorization=NET.cred;
  const r=await fetch('/api/'+path,{method:o.method||'GET',headers:h,body:o.body,cache:'no-store'});let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((d&&d.error)||String(r.status));e.status=r.status;throw e}return d}
const destLabel=()=>({caba:'Capital Federal',arg:'Argentina · '+ui.prov,ext:'Exterior'+(ui.country.trim()?' ('+ui.country.trim()+')':'')}[ui.dest]||'');
function orderPayload(kind){
  if(kind==='team'){const T=teamInit(),p=S.products.find(x=>x.id===T.pid),rows=T.rows.filter(r=>r.n.trim()||r.num.trim());
    return {type:'equipo',name:ui.name,phone:ui.phone,club:T.club,design:p?p.title:'Diseño propio',garment:garmentName(T.garment),color:colorName(T.color),rows,dest:destLabel(),total:(p?priceNum(p.price):0)*rows.length}}
  const e=shipNow();
  return {type:'pedido',name:ui.name,phone:ui.phone,dest:destLabel(),note:ui.note,items:ui.cart.map(i=>({title:i.title,garment:i.garment,color:i.color,size:i.size,qty:i.qty,pers:i.pers||'',price:i.price||0})),total:cartTotal(),ship:e?money(e)+' con '+carrierName()+' (aprox.)':''};
}
async function postOrder(kind){
  if(!NET.on)return;const body=orderPayload(kind),k='sf_sent_'+sha256(JSON.stringify(body)).slice(0,16);if(sess.get(k))return;sess.set(k,'1');
  try{await api('order',{method:'POST',json:body,auth:'user'});if(ACC.token)setTimeout(()=>accPoll(false),900)}catch(e){sess.set(k,null)}
}

function sha256(str){const rr=(v,a)=>(v>>>a)|(v<<(32-a)),h=[],k=[];for(let c=2,n=0;n<64;c++){let p=true;for(let i=2;i*i<=c;i++)if(c%i===0){p=false;break}if(p){h[n]=(Math.sqrt(c)*4294967296)|0;k[n++]=(Math.cbrt(c)*4294967296)|0}}
  const b=Array.from(new TextEncoder().encode(str)),l=b.length*8;b.push(128);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
  const w=new Int32Array(64);let H=h.slice(0,8);for(let o=0;o<b.length;o+=64){for(let i=0;i<16;i++)w[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(c,17)^rr(c,19)^(c>>>10)))|0}
  let A=H[0],B=H[1],C=H[2],D=H[3],E=H[4],F=H[5],G=H[6],T=H[7];for(let i=0;i<64;i++){const t1=(T+(rr(E,6)^rr(E,11)^rr(E,25))+((E&F)^(~E&G))+k[i]+w[i])|0,t2=((rr(A,2)^rr(A,13)^rr(A,22))+((A&B)^(A&C)^(B&C)))|0;T=G;G=F;F=E;E=(D+t1)|0;D=C;C=B;B=A;A=(t1+t2)|0}
  H=[H[0]+A|0,H[1]+B|0,H[2]+C|0,H[3]+D|0,H[4]+E|0,H[5]+F|0,H[6]+G|0,H[7]+T|0]}return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
function passHash(salt,user,pass){let h=salt+'|'+user.trim().toLowerCase()+'|'+pass;for(let i=0;i<600;i++)h=sha256(h+salt);return h}
function makeAuth(user,pass){const salt=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b=>b.toString(16).padStart(2,'0')).join('');return {user:user.trim(),salt,hash:passHash(salt,user,pass)}}

/* Netlify: images go to the data store one by one, then the catalogue as a small JSON that every visitor loads */
async function netPublish(){
  adm.busy=true;renderAdmin();
  const up=async u=>{if(typeof u!=='string'||u.indexOf('data:image/')!==0)return u;if(upCache.has(u))return upCache.get(u);
    const r=await fetch('/api/img',{method:'POST',headers:{Authorization:NET.cred,'Content-Type':'text/plain'},body:u});if(r.status===401)throw 401;if(!r.ok)throw r.status;const j=await r.json();upCache.set(u,j.url);return j.url};
  try{
    st.logo=await up(st.logo);
    for(const p of S.products){if(p.print)p.print=await up(p.print);if(p.photo)p.photo=await up(p.photo);for(const l of (p.layers||[]))l.img=await up(l.img)}
    for(const g of (st.gallery||[]))g.img=await up(g.img);
    const r=await fetch('/api/state',{method:'PUT',headers:{Authorization:NET.cred,'Content-Type':'application/json'},body:JSON.stringify({settings:st,products:S.products})});
    if(r.status===401)throw 401;if(!r.ok)throw r.status;
    adm.dirty=false;toast('Cambios publicados. Ya los ve todo el mundo.');
  }catch(e){if(e===401){NET.cred=null;sess.set('sf_cred',null);adm.busy=false;closeAdmin(true);openLogin('Tu sesión venció. Volvé a entrar.');return}toast('No se pudo publicar. Revisá tu conexión y probá de nuevo.')}
  adm.busy=false;renderAdmin();
}
async function publish(){
  if(adm.busy)return;if(NET.on)return netPublish();adm.busy=true;renderAdmin();
  let art=null;try{art=window.claude&&window.claude.use?await window.claude.use('artifact'):null}catch(e){}
  const fail=m=>{adm.busy=false;sess.set('sf_flash',null);sess.set('sf_reopen',null);renderAdmin();toast(m)};
  if(!art)return fail('Desde esta vista no se puede publicar. Abrí la página dentro de Claude con tu cuenta.');
  const html=buildDocument();if(html.length>15.5*1048576)return fail('La página pesa más de 16 MB. Borrá alguna publicación o subí imágenes más livianas.');
  sess.set('sf_flash','Cambios publicados. Ya los ve todo el mundo.');sess.set('sf_reopen','1');
  try{await art.publish(html)}catch(e){
    const c=e&&e.code;
    if(c==='conflict'){sess.set('sf_flash',null);return}
    if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){adm.readOnly=true;return fail('Esta vista es de solo lectura. Entrá con la cuenta de Claude dueña de la página para publicar.')}
    if(c==='too_large')return fail('La página quedó demasiado pesada. Borrá alguna publicación o subí imágenes más livianas.');
    if(c==='rate_limited')return fail('Publicaste varias veces seguidas. Esperá un minuto y probá de nuevo.');
    return fail('No se pudo publicar. Revisá tu conexión y probá de nuevo.');
  }
}

    case 'epost':{if(!pv){toast('La vista 3D no está disponible en este navegador.');break}savePoster(pv.capture(1000,1000),{title:adm.ed.title||'Nuevo diseño',price:adm.ed.price});break}
    case 'ppost':{const p=S.products.find(x=>x.id===v),sh=getShooter();if(!p||!sh){toast('La vista 3D no está disponible en este navegador.');break}sh.prepare(vcfg(p)).then(()=>savePoster(sh.capture(1000,1000,zoneAngle(mainZone(p))-.38),p));break}
    case 'ltext':addLayer('',{zone:'back',x:0,y:.3,w:.5,text:{t:'NOMBRE',n:'10',f:'varsity',c:isLight(adm.ed.color)?'#141414':'#FFFFFF'}});ltextRender(true);break;
    case 'ltfont':{const l=adm.ed.layers[adm.sel];if(l&&l.text){l.text.f=v;ltextRender(false)}break}
    case 'gfile':$('#g_file').click();break;
    case 'gdel':st.gallery.splice(+v,1);adm.dirty=true;renderAdmin();break;
    case 'gmove':{const G=st.gallery,i=+v,j=i+(+b.dataset.d);if(j>=0&&j<G.length){const t=G[i];G[i]=G[j];G[j]=t;adm.dirty=true;renderAdmin()}break}
    case 'filter':ui.filter=v;renderFilters();renderGrid();break;
    case 'dest':ui.dest=v;store.set('sf_dest',v);renderShip();if(b.dataset.cart)openCart();if(b.dataset.team){$$('[data-team]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));updTeam()}break;
    case 'care':ui.care=v;renderCare();break;
    case 'rm':ui.cart.splice(+v,1);saveCart();openCart();break;
    case 'cqty':{const i=ui.cart[+v];if(i){i.qty=clamp(i.qty+(+b.dataset.d),1,99);saveCart();openCart()}break}
    case 'copyOrder':copyText(orderText(),'Pedido copiado. Pegalo en el chat.');break;
    case 'copy':copyText(b.dataset.copy,'Número copiado');break;
    case 'admin':if(NET.on){NET.cred=NET.cred||sess.get('sf_cred');if(NET.cred)openAdmin();else openLogin()}else if(sess.get('sf_admin')==='1'&&S.auth)openAdmin();else openLogin();break;
    case 'admClose':closeAdmin(false);break;case 'logout':NET.cred=null;sess.set('sf_cred',null);closeAdmin(true);toast('Saliste del panel.');break;
    case 'atab':adm.tab=v;adm.ed=null;renderAdmin();break;
    case 'publish':publish();break;
    case 'pnew':adm.sel=0;adm.ed=newDraft();adm.confirm=null;renderPubs();$('#edF').scrollIntoView({block:'nearest'});break;
    case 'pedit':adm.sel=0;adm.ed=newDraft(S.products.find(p=>p.id===v));adm.confirm=null;renderPubs();$('#edF').scrollIntoView({block:'nearest'});break;
    case 'pcancel':adm.ed=null;renderPubs();break;
    case 'pdel':adm.confirm=v;renderPubs();break;case 'pdelNo':adm.confirm=null;renderPubs();break;
    case 'pdelYes':S.products=S.products.filter(p=>p.id!==v);if(ui.sel===v)ui.sel=S.products[0]?S.products[0].id:null;if(adm.ed&&adm.ed.id===v)adm.ed=null;adm.confirm=null;adm.dirty=true;renderAdmin();toast('Publicación borrada. Falta publicar.');break;
    case 'pmove':{const i=+v,j=i+(+b.dataset.d);if(j>=0&&j<S.products.length){const t=S.products[i];S.products[i]=S.products[j];S.products[j]=t;adm.dirty=true;renderAdmin()}break}
    case 'ephotoRm':adm.ed.photo='';renderPubs();break;
    case 'pview':if(pv)pv.viewTo(zoneAngle(v));break;
    case 'pzoom':if(pv)pv.zoomBy(+v);break;
    case 'lfile':$('#e_file').click();break;
    case 'llogo':addLayer(st.logo,{x:.22,y:.42,w:.16});pvSync(true);break;
    case 'lsel':adm.sel=+v;if(pv){pv.select(adm.sel);pv.viewTo(zoneAngle(adm.ed.layers[adm.sel].zone))}renderLayers();break;
    case 'ldel':adm.ed.layers.splice(+v,1);adm.sel=clamp(adm.sel>+v?adm.sel-1:adm.sel,0,Math.max(0,adm.ed.layers.length-1));pvSync(false);break;
    case 'lup':{const L=adm.ed.layers,i=+v;if(i<L.length-1){const t=L[i];L[i]=L[i+1];L[i+1]=t;adm.sel=i+1;pvSync(false)}break}
    case 'ldup':{const l=adm.ed.layers[adm.sel];if(l){adm.ed.layers.push(Object.assign({},l,{x:(l.x||0)+.06,y:l.y-.06}));adm.sel=adm.ed.layers.length-1;pvSync(false)}break}
    case 'lcenter':{const l=adm.ed.layers[adm.sel];if(l){l.x=isSleeve(l.zone)?zoneDefault(adm.ed.garment,l.zone).x:0;if(pv)pv.repaint();syncLayerInputs()}break}
    case 'lrot0':{const l=adm.ed.layers[adm.sel];if(l){l.rot=0;if(pv)pv.repaint();syncLayerInputs()}break}
    case 'lzone':{const l=adm.ed.layers[adm.sel];if(l&&l.zone!==v){const d=zoneDefault(adm.ed.garment,v),sl=isSleeve(v);l.zone=v;l.x=d.x;l.y=d.y;if(sl&&l.w>.3)l.w=d.w;l.rot=0;if(pv){pv.repaint();pv.viewTo(zoneAngle(v))}renderLayers()}break}
    case 'lkey':{const l=adm.ed.layers[adm.sel];if(l)loadImg(l.img).then(i=>{if(!i)return;l.img=makePrint(i,true);pvSync(false);toast('Fondo quitado.')});break}
  }
});
document.addEventListener('submit',ev=>{ev.preventDefault();const id=ev.target.id;
  if(id==='cliF'){doAuth(ev.target);return}if(ev.target.classList.contains('chatF')){sendChat(ev.target);return}
  if(id==='loginF')doLogin();else if(id==='edF')saveDraft();else if(id==='setF')saveSettings();
  else if(id==='accF'){const u=$('#a_user').value,p=$('#a_p1').value,err=$('#a_err');if(u.trim().length<3){err.textContent='El usuario necesita al menos 3 letras.';return}if(p.length<6){err.textContent='La contraseña necesita al menos 6 caracteres.';return}if(p!==$('#a_p2').value){err.textContent='Las dos contraseñas no coinciden.';return}S.auth=makeAuth(u,p);adm.dirty=true;renderAdmin();toast('Acceso guardado. Falta publicar.')}
});
document.addEventListener('input',ev=>{const t=ev.target,id=t.id;
  if(id==='q'){ui.q=t.value;renderGrid()}
  else if(id==='pName'||id==='pNum'){const first=!ui.pers.t&&!ui.pers.n;ui.pers[id==='pName'?'t':'n']=t.value;persUpdate(first)}
  else if(id==='tClub'){teamInit().club=t.value;updTeam()}
  else if(/^t[nu]_\d+$/.test(id)){const r=teamInit().rows[+id.slice(3)];if(r){r[id[1]==='n'?'n':'num']=t.value;updTeam()}}
  else if(/^g_cap_\d+$/.test(id)){const g=st.gallery[+id.slice(6)];if(g){g.cap=t.value;if(!adm.dirty){adm.dirty=true;const bt=$('[data-act="publish"]');if(bt)bt.disabled=false}}}
  else if(adm.ed&&(id==='lt_t'||id==='lt_n'||id==='lt_c')){const l=adm.ed.layers[adm.sel];if(l&&l.text){l.text[id.slice(3)]=t.value;ltextRender(false)}}
  else if(id==='oPhone'||id==='tPhone'){ui.phone=t.value;store.set('sf_phone',ui.phone);updOrder();updTeam()}
  else if(id==='tName'){ui.name=t.value;store.set('sf_name',ui.name);updTeam()}
  else if(t.classList&&t.classList.contains('qnum')){ui.qn=clamp(parseInt(t.value)||1,1,200);updQuote()}
  else if(id==='oName'){ui.name=t.value;store.set('sf_name',ui.name);updOrder()}else if(id==='oCountry'){ui.country=t.value;updOrder()}else if(id==='oNote'){ui.note=t.value;updOrder()}
  else if(ui.custom.layer&&(id==='cScale'||id==='cY'||id==='cX'||id==='cRot')){ui.custom.layer[{cScale:'w',cY:'y',cX:'x',cRot:'rot'}[id]]=+t.value;if(viewer)viewer.repaint()}
  else if(adm.ed&&adm.ed.layers[adm.sel]&&(id==='l_w'||id==='l_x'||id==='l_y'||id==='l_rot')){adm.ed.layers[adm.sel][id.slice(2)]=+t.value;if(pv)pv.repaint()}
  else if(adm.ed&&t.dataset.f){adm.ed[t.dataset.f]=t.value}
  else if(adm.ed&&id==='e_custom'){adm.ed.color=t.value;if(pv)pv.set(vcfg(adm.ed))}
});
document.addEventListener('change',async ev=>{const t=ev.target,id=t.id;
  try{
    if(id==='upCustom'&&t.files[0]){ui.custom.raw=await readFile(t.files[0]);t.value='';ui.custom.layer={img:makePrint(ui.custom.raw,ui.custom.key),zone:'front',x:0,y:.2,w:.55,rot:0};select('custom',true);toast('Listo. Así queda tu diseño.')}
    else if(id==='cKey'){ui.custom.key=t.checked;if(ui.custom.raw&&ui.custom.layer){ui.custom.layer.img=makePrint(ui.custom.raw,ui.custom.key);renderStrip();syncViewer(false)}}
    else if(id==='e_file'&&t.files.length){for(const f of Array.from(t.files))addLayer(makePrint(await readFile(f),adm.ed._key));t.value='';pvSync(true)}
    else if(id==='e_key'){adm.ed._key=t.checked}
    else if(id==='tPid'){const T=teamInit(),p=S.products.find(x=>x.id===t.value);T.pid=t.value;if(p){T.garment=p.garment;T.color=p.color}openTeam()}
    else if(t.classList.contains('qzone')){ui.prov=t.value;store.set('sf_prov',ui.prov);updQuote()}
    else if(t.classList.contains('ostsel')){const o=(ORD.list||[]).find(x=>x.id===t.dataset.id);try{const n=await api('orders/'+encodeURIComponent(t.dataset.id),{method:'PATCH',json:{status:t.value},auth:'admin'});if(o)Object.assign(o,n);renderOrdersAdm();toast('Estado actualizado. El cliente lo ve en su cuenta.')}catch(e){toast('No se pudo cambiar el estado.')}}
    else if(id==='tGar'){teamInit().garment=t.value;updTeam()}else if(id==='tCol'){teamInit().color=t.value;updTeam()}
    else if(/^ts_\d+$/.test(id)){const r=teamInit().rows[+id.slice(3)];if(r){r.s=t.value;updTeam()}}
    else if(id==='g_file'&&t.files.length){for(const f of Array.from(t.files))st.gallery.push({img:encode(toCanvas(await readFile(f),1100),false),cap:''});t.value='';adm.dirty=true;renderAdmin();toast('Fotos agregadas. Falta publicar.')}
    else if(id==='e_photo'&&t.files[0]){adm.ed.photo=encode(toCanvas(await readFile(t.files[0]),900),false);renderPubs()}
    else if(id==='e_garment'){adm.ed.layers.forEach(l=>{const b=zoneBounds(adm.ed.garment,l.zone);l.x=clamp(l.x||0,b.x[0],b.x[1]);if(l.y!=null)l.y=clamp(l.y,b.y[0],b.y[1])});pvSync(false)}
    else if(id==='e_color'){adm.ed.color=t.value;pvSync(false)}
    else if(id==='s_logo'&&t.files[0]){st.logo=encode(toCanvas(await readFile(t.files[0]),320),true);adm.dirty=true;toast('Logo cargado. Guardá los ajustes y publicá.')}
  }catch(e){toast('No pudimos leer esa imagen. Probá con un archivo JPG o PNG.')}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#layer').innerHTML)closeLayer();
  if($('.lb')&&(ev.key==='ArrowRight'||ev.key==='ArrowLeft')){const n=$(ev.key==='ArrowRight'?'.lbn':'.lbp');if(n)n.click()}});
document.addEventListener('toggle',ev=>{if(ev.target.id==='persBox')ui.pers.open=ev.target.open},true);
let ltT=0;function ltextRender(turn){clearTimeout(ltT);ltT=setTimeout(async()=>{const l=adm.ed&&adm.ed.layers[adm.sel];if(!l||!l.text)return;const img=await textImg(l.text);if(img){l.img=img;pvSync(turn)}else if(turn)pvSync(true)},150)}
document.addEventListener('pointermove',ev=>{if(reduced||ev.pointerType==='touch')return;const c=ev.target.closest&&ev.target.closest('.card');$$('.card').forEach(k=>{if(k!==c){k.style.removeProperty('--rx');k.style.removeProperty('--ry')}});if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--ry',((ev.clientX-r.left)/r.width-.5)*9+'deg');c.style.setProperty('--rx',(.5-(ev.clientY-r.top)/r.height)*7+'deg')});

/* ---------------- boot ---------------- */
$('#app').innerHTML=shell();
ui.sel=S.products[0]?S.products[0].id:null;
{const p=cur();if(p){ui.color=p.color;ui.garment=p.garment}}
renderAll();
$('#cbox').classList.add('loading');
viewer=Shirt3D($('#gl'),{interactive:true,spin:ui.spin,mouseEdit:true,hanger:true,logo:st.logo,onReady(){$('#cbox').classList.remove('loading')},onGrab(){$('#hint').classList.add('off')},onLayer(i,what){if(what!=='change')return;const l=ui.custom.layer;if(!l)return;[['cScale',l.w],['cY',l.y],['cX',l.x||0]].forEach(q=>{const el=document.getElementById(q[0]);if(el)el.value=q[1]})}});
syncViewer(true);if(!viewer)$('#cbox').classList.remove('loading');
(async()=>{try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}if(dl)document.documentElement.classList.add('can-dl')})();
setInterval(()=>{const o=openStatus(),pill=$('#openPill');pill.classList.toggle('on',o.on);$('span',pill).textContent=o.text},60000);
{const f=sess.get('sf_flash');if(f){sess.set('sf_flash',null);toast(f)}}
(async()=>{
  if(!/^https?:$/.test(location.protocol))return;
  try{const r=await fetch('/api/state',{cache:'no-store'});if(r.headers.get('x-sf-api')!=='1')return;NET.on=true;document.documentElement.classList.add('net');
    api('config').then(c=>{ACC.google=(c&&c.google)||''}).catch(()=>{});renderAccBtn();if(ACC.token){accPoll(false);ACC.poll=setInterval(()=>accPoll(false),60000)}
    if(r.ok){const d=await r.json();if(d&&d.settings&&Array.isArray(d.products)){Object.keys(st).forEach(k=>delete st[k]);Object.assign(st,d.settings);S.products=d.products;
      if(!st.faq)st.faq=DEF_FAQ;if(!st.gallery)st.gallery=[];if(ui.sel!=='custom'&&!cur()){ui.sel=S.products[0]?S.products[0].id:null}
      {const p=cur();if(p&&p.id!=='custom'){ui.color=p.color;ui.garment=p.garment}}
      $('.brand img').src=st.logo;$('.brand span').textContent=st.name;{const fi=document.getElementById('sf-icon');if(fi&&st.logo)fi.href=st.logo}renderAll();syncViewer(true);if(adm.open)renderAdmin()}}
  }catch(e){}
})();
if(sess.get('sf_reopen')==='1'){sess.set('sf_reopen',null);if(sess.get('sf_admin')==='1'&&S.auth)openAdmin()}
})();
</script>
</body></html>
